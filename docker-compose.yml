services:
  data:
    build: 
      context: .
    command: ./data
    networks:
      - private_net
      - database_net # Only data layer should be able to access databases
    expose:
      - "666"
    environment:
      GRPC_LISTEN_ADDR: ":666"
  
  auth:
    build: 
      context: .
    command: ./auth
    networks:
        - public_net
        - private_net 
    ports:
      - "6767"
    environment:
      DATA_SERVICE_LISTEN_ADDR: data:666
      AUTH_SERVICE_LISTEN_ADDR: :6767

  database:
    image: "postgres:latest"
    ports: 5432:5432
    environment:
      POSTGRES_USER: data-service
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database
    volumes:
      - ./db-data/:/var/lib/postgresql/data
    networks:
      - database_net 
    
networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
  database_net:
    driver: bridge